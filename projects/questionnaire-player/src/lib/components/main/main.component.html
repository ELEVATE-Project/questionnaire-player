<div [ngClass]="{'custom-font': apiConfig?.usePageQuestionsGrid === true,'custom-font-grid': apiConfig?.usePageQuestionsGrid === false}"
[style.grid-template-columns]="apiConfig?.gridCount > 1 ? 'repeat(' + apiConfig?.gridCount + ', 1fr)' : 'auto'"
>
  <ng-container *ngIf="!questionnaireInstance else paginationNonApplicableInstance">
    <ng-container *ngFor="
        let question of questions;
        let qi = index;
        trackBy: questionTrackBy
      ">
      <ng-container [ngTemplateOutlet]="questionnaire"
        [ngTemplateOutletContext]="{ question: question, qi: qi, pageId:qi }"></ng-container>
    </ng-container>
    <lib-paginator *ngIf="paginatorLength > 1" [questions]="questions" [currentPage]="pageIndex" (page)="handlePageEvent($event)"></lib-paginator>
  </ng-container>
</div>
<ng-template #paginationNonApplicableInstance>
  <ng-container *ngFor="
        let question of questions
        let qi = index;
        trackBy: questionTrackBy
      ">
    <ng-container [ngTemplateOutlet]="questionnaire"
      [ngTemplateOutletContext]="{ question: question, qi: qi }"></ng-container>
  </ng-container>
</ng-template>

<ng-template #questionnaire let-question="question" let-qi="qi" let-pageId="pageId">
  <span [id]="pageId">
  <ng-container *ngIf="
      question?.sectionHeader &&
      (!question.visibleIf?.length || question.canDisplay == true)
    ">
    <h4 class="section-header-style headerMargin">{{ question?.sectionHeader }}</h4>
    <hr [ngStyle]="{
        'background-color':
          question.responseType != 'pageQuestions' && apiConfig?.usePageQuestionsGrid === true
            ? 'var(--primary-color)'
            : null,
        height: question.responseType != 'pageQuestions' && apiConfig?.usePageQuestionsGrid === true ? '3px' : 0
      }" />
  </ng-container>
  <div [ngStyle]="{
      padding: question.responseType != 'pageQuestions' && apiConfig?.usePageQuestionsGrid === true ? '1rem' : 0,
      margin: question.responseType != 'pageQuestions' && apiConfig?.usePageQuestionsGrid === true ? '0.5rem' : 0
    }" [ngClass]="{
      'mat-elevation-z8': question.responseType != 'pageQuestions' && apiConfig?.usePageQuestionsGrid === true,
      activeCard: question.responseType != 'pageQuestions' && apiConfig?.usePageQuestionsGrid === true,
      'submitted': (isSubmitted || isExpired || question.readonly === true)
    }" class="responsive-margin" *ngIf="!question.visibleIf?.length || question.canDisplay == true">
    <div [ngClass]="{ content: question.responseType != 'pageQuestions' && apiConfig?.usePageQuestionsGrid === true }" [ngClass]="{'d-flex flex-dr flex-gap-10 flex-jc-space-between': apiConfig?.labelInputHorizontalLayout === true}">
      <div class="spaceBetweenContent">
        <div *ngFor="let q of question.question; let qai = index" class="mb-20" [ngClass]="{'label-container': apiConfig?.labelInputHorizontalLayout === true}">
          <div *ngIf="q != ''" class="wc-primary-color">
            {{ question.questionNumber ? question.questionNumber + " . " : "" }}&nbsp;{{ q }} <span *ngIf="question.validation.required" class="colorRed">*</span>
            <button *ngIf="question?.hint" mat-icon-button class="wc-primary-color"
              aria-label="Icon-button with a lightbulb icon" matTooltip="Hint about the question"
              (click)="openDialog(question.hint)">
              <mat-icon style="vertical-align: middle">emoji_objects_outline</mat-icon>
            </button>
          </div>
        </div>
      </div>
      <ng-container *ngIf="question?.tip">
        <p class="question-tip">
          {{ question?.tip }}
        </p>
      </ng-container>
      <div class="d-flex flex-gap-10" [ngClass]="apiConfig?.usePageQuestionsGrid === true ? 'flex-dr' : 'flex-dc'">
        <lib-text-input [id]="question._id" tabindex="-1" *ngIf="question.responseType == reponseType.TEXT" [questionnaireForm]="questionnaireForm"
          [question]="question"></lib-text-input>
          <lib-text-area [id]="question._id" tabindex="-1" *ngIf="question.responseType == reponseType.TEXTAREA" [questionnaireForm]="questionnaireForm"
          [question]="question"></lib-text-area>
        <ng-container *ngIf="question.responseType == reponseType.PAGEQUESTIONS">
          <lib-main [questions]="question.pageQuestions" [questionnaireForm]="questionnaireForm"
            [fileUploadResponse]="fileUploadResponse" [questionnaireInstance]="true" [fileSizeLimit]="fileSizeLimit"></lib-main>
        </ng-container>
        <lib-number-input  tabindex="-1"  [id]="question._id" *ngIf="question.responseType == reponseType.NUMBER" [questionnaireForm]="questionnaireForm"
          [question]="question"></lib-number-input>
        <lib-radio-input
          tabindex="-1"
          [id]="question._id"
          *ngIf="
            question.responseType == reponseType.RADIO &&
            (!(displayTypeArray.includes(question.displayType))) &&
            question.requireDynamicAnswers !== true
          "
          [questionnaireForm]="questionnaireForm"
          [question]="question" [options]="question.options"
          (dependentParent)="toggleQuestion($event)"></lib-radio-input>
        <lib-checkbox-input tabindex="-1" [id]="question._id"
          *ngIf="
            question.responseType == reponseType.MULTISELECT &&
            (!(displayTypeArray.includes(question.displayType))) &&
            question.requireDynamicAnswers !== true
          "
          [questionnaireForm]="questionnaireForm"
          [question]="question"
          [options]="question.options"
          (dependentParent)="toggleQuestion($event)">
        </lib-checkbox-input>
        <lib-range-input tabindex="-1" [id]="question._id" *ngIf="question.responseType == reponseType.SLIDER" [questionnaireForm]="questionnaireForm"
          [question]="question"></lib-range-input>
        <lib-date-input [id]="question._id" tabindex="-1" *ngIf="question.responseType == reponseType.DATE" [questionnaireForm]="questionnaireForm"
          [question]="question"></lib-date-input>
        <lib-entity-dropdown-input [apiConfig]="apiConfig" [id]="question._id" tabindex="-1"
          *ngIf="
            question.requireDynamicAnswers === true &&
            (question.responseType == reponseType.RADIO || question.responseType == reponseType.MULTISELECT)
          "
          [questionnaireForm]="questionnaireForm"
          [question]="question" (dependentParent)="toggleQuestion($event)"></lib-entity-dropdown-input>
        <lib-select-dropdown-input [id]="question._id" tabindex="-1"
          *ngIf="
            question.responseType == reponseType.RADIO &&
            question.displayType == displayType.SELECT_DROPDOWN"
          [questionnaireForm]="questionnaireForm"
          [question]="question" [options]="question.options" (dependentParent)="toggleQuestion($event)"></lib-select-dropdown-input>
        <lib-select-dropdown-input [id]="question._id" tabindex="-1"
          *ngIf="
            question.responseType == reponseType.MULTISELECT &&
            question.displayType == displayType.MULTISELECT_DROPDOWN"
          [questionnaireForm]="questionnaireForm"
          [question]="question" [options]="question.options" (dependentParent)="toggleQuestion($event)"></lib-select-dropdown-input>
        <lib-file-upload-input [id]="question._id" tabindex="-1"
          *ngIf="
            (question.responseType == reponseType.RADIO ||
            question.responseType == reponseType.MULTISELECT) &&
            question.displayType == displayType.FILE_UPLOAD
          "
          [questionnaireForm]="questionnaireForm"
          [question]="question" [fileSizeLimit]="fileSizeLimit" [apiConfig]="apiConfig"></lib-file-upload-input>
        <lib-matrix-questions *ngIf="question.responseType == reponseType.MATRIX"
          [questionnaireForm]="questionnaireForm" [question]="question" #libMatrix>
          <ng-template #libMainTemplateRef>
            <lib-main [questions]="libMatrix.context.questions" [questionnaireForm]="libMatrix.matrixForm"
              [fileUploadResponse]="fileUploadResponse" [questionnaireInstance]="true" [fileSizeLimit]="fileSizeLimit" [apiConfig]="apiConfig"></lib-main>
          </ng-template>
        </lib-matrix-questions>
        <lib-remarks [question]="question" *ngIf="question.showRemarks"></lib-remarks>
        <lib-attachment *ngIf="question.file && question.responseType != 'fileUpload' && question.displayType != displayType.FILE_UPLOAD" [fileSizeLimit]="fileSizeLimit" [data]="{
            submissionId: qService.getSubmissionId(),
            files: question.fileName
          }" [questionId]="question._id + qi" [fileSizeLimit]="fileSizeLimit" [questionFile]="question.file" [apiConfig]="apiConfig">
        </lib-attachment>
      </div>
        <lib-dialog #dialogCmp [isDimmed]="isDimmed" [hint]="question?.hint"
          (closeHintEmitter)="closeHint()"></lib-dialog>
    </div>
  </div>
</span>
</ng-template>

<div [attr.id]="'matrix-' + question._id" [attr.data-question-id]="question._id" class="matrix-question-container">
  <div class="d-flex flex-jc-flex-end">
    <button class="btn-primary" [attr.id]="'matrix-add-btn-' + question._id" (click)="addInstances()">
      {{ addText }}
      {{ question?.instanceIdentifier }}
    </button>
  </div>
  <mat-card
    *ngFor="let instance of question?.value; let i = index"
    class="instance-card"
  >
    <div class="display-row">
      <div
        (click)="viewInstance(i)"
        class="instance-details"
        [ngClass]="{ 'valid-response': formAsArray?.controls[i]?.valid }"
      >
        <div class="header-line">
          <span class="student-label">
            {{ question?.instanceIdentifier }} {{ i + 1 }}
          </span>
          <button
            mat-icon-button
            matTooltip="Delete instance"
            aria-label="icon-button with a delete icon"
            style="color: var(--primary-color);"
            (click)="deleteInstanceAlert(i);$event.stopPropagation()"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </div>

        <span class="updated-label" *ngIf="instanceLastUpdated[i]">
          Last Updated On: {{ instanceLastUpdated[i] | date : "short" }}
        </span>

        <!-- Preview of filled data (first 5 fields) -->
        <div class="data-preview" *ngIf="getInstancePreviewData(i).length > 0">
          <div class="preview-item" *ngFor="let field of getInstancePreviewData(i)">
            <span class="preview-label">{{ field.label }}:</span>
            <span class="preview-value">{{ field.value }}</span>
          </div>
          <div class="more-indicator" *ngIf="hasMoreFields(i)">
            <span class="more-text">Click to view all fields...</span>
          </div>
        </div>
      </div>
    </div>
  </mat-card>
</div>

<ng-template #modal>
  <div
    mat-dialog-title
    class="d-flex flex-dr flex-ai-center flex-gap-3 flex-jc-flex-start p-10"
    style="color: var(--primary-color);"
  >
    {{ context?.heading }}
  </div>
  <mat-divider></mat-divider>
  <div mat-dialog-content>
    <ng-container *ngTemplateOutlet="libMainTemplateRef"></ng-container>
  </div>
  <div mat-dialog-actions class="d-flex flex-jc-space-around">
    <button
      [disabled]="!matrixForm?.valid"
      type="button"
      (click)="matrixSubmit(context.index)"
      [ngClass]="{
        'btn-primary': matrixForm?.valid,
        'btn-disabled': !matrixForm?.valid
      }"
    >
      {{ submitText }}
    </button>
    <button
      class="btn-outline-primary"
      type="button"
      (click)="showBadgeAssingModel = false; closeModal()"
    >
      {{ cancelText }}
    </button>
  </div>
</ng-template>

<div style="padding: 20px;">
    <h3 class="mb-3 font-bold">Upload Evidences</h3>
    <hr>
    <div class="d-flex d-flex-r mt-10">
        <mat-checkbox [(ngModel)]="isChecked" class="mr-3"></mat-checkbox>
        <div>
            <span class="paragraph">I confirm that the content submitted by me comply with the terms and policies of Elevate, including <a href="https://shikshalokam.org/mentoring/privacy-policy/" target="_blank">Elevate's Content Policy</a>.</span>
            <!-- <a href="https://shikshalokam.org/mentoring/privacy-policy/" class="text-blue-600" target="_blank">Content Policy</a>. -->
            <span class="paragraph"> I have made sure that I do not violate other's copyright, privacy or third party rights.</span>
        </div>
    </div>
    <div class="d-flex d-flex-r mt-10 gap-3">
        <button mat-flat-button (click)="closePopup(false)"
          class="flex-1 !rounded-3xl buttons"
          [ngClass]="{'primary-button':!isChecked,'disabled-button':isChecked}">
          Do not upload
        </button>
      
        <button mat-flat-button (click)="closePopup(true)" [disabled]="!isChecked"
          class="flex-1 !rounded-3xl buttons"
          [ngClass]="{'primary-button':isChecked,'disabled-button':!isChecked}">
          Upload
        </button>
      </div>
      
</div>

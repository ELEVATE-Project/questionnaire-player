<div
  [formGroup]="questionnaireForm"
  *ngIf="questionnaireForm?.contains(question._id)"
>
  <div class="d-flex flex-jc-left flex-ai-center flex-gap-10">
    <span class="attachment-btn" tabindex="0">
      <button
        class="d-flex flex-jc-center flex-ai-center flex-gap-10 upload-label"
        (click)="handleFileUpload()"
        type="button"
      >
        <mat-icon class="w-auto h-auto">upload</mat-icon>
        Add file
      </button>
    </span>
    <input
      type="file"
      id="input-{{ question._id }}"
      hidden
      (change)="onFileSelected($event)"
      #fileInput
    />
  </div>

  <div *ngIf="fileList.length > 0" class="d-flex flex-dr flex-gap-20 wc-primary-color mt-20 row-wrap">
    <ng-container *ngFor="let file of fileList; let i = index; trackBy: filesTrackBy">
      <ng-container [ngSwitch]="getFileType(file.name)">
        <div *ngSwitchCase="'image'" class="iconList">
          <mat-icon
            class="customizeIcon"
            matTooltip="View the uploaded image"
            matTooltipClass="tooltip"
            (click)="showFilePreview(file, 'image')"
            >image</mat-icon
          >
          <mat-icon
            matTooltip="Remove the uploaded image"
            class="cancelIcon"
            (click)="deleteAttachment(i)"
            >cancel</mat-icon
          >
        </div>
        <div *ngSwitchCase="'pdf'" class="iconList">
          <mat-icon
            class="customizeIcon"
            matTooltip="View the uploaded pdf"
            matTooltipClass="tooltip"
            (click)="openUrl(file)"
            >picture_as_pdf</mat-icon
          >
          <mat-icon
            matTooltip="Remove the uploaded pdf"
            class="cancelIcon"
            matTooltipClass="tooltip"
            (click)="deleteAttachment(i)"
            >cancel</mat-icon
          >
        </div>
        <div *ngSwitchCase="'video'" class="iconList">
          <mat-icon
            class="customizeIcon"
            matTooltip="View the uploaded video"
            matTooltipClass="tooltip"
            (click)="showFilePreview(file, 'video')"
            >video_file</mat-icon
          >
          <mat-icon
            matTooltip="Remove the uploaded video"
            class="cancelIcon"
            matTooltipClass="tooltip"
            (click)="deleteAttachment(i)"
            >cancel</mat-icon
          >
        </div>
        <div *ngSwitchCase="'audio'" class="iconList">
          <mat-icon
            class="customizeIcon"
            matTooltip="View/listen to the uploaded audio"
            matTooltipClass="tooltip"
            (click)="showFilePreview(file, 'audio')"
            >audio_file</mat-icon
          >
          <mat-icon
            matTooltip="Remove the uploaded audio"
            class="cancelIcon"
            matTooltipClass="tooltip"
            (click)="deleteAttachment(i)"
            >cancel</mat-icon
          >
        </div>
        <div *ngSwitchDefault class="iconList">
          <mat-icon
            class="customizeIcon"
            matTooltip="View the uploaded file"
            matTooltipClass="tooltip"
            (click)="showFilePreview(file, 'doc')"
            >description</mat-icon
          >
          <mat-icon
            matTooltip="Remove the uploaded file"
            class="cancelIcon"
            matTooltipClass="tooltip"
            (click)="deleteAttachment(i)"
            >cancel</mat-icon
          >
        </div>
      </ng-container>
    </ng-container>
  </div>
</div>
<mat-error
  *ngIf="questionnaireForm?.contains(question._id) && isTouched && !isValid"
  >{{ getValidationMessage(question._id) }}</mat-error
>

<ng-template #previewModal>
  <div class="relative">
    <div class="close-canle-btn">
      <mat-icon (click)="closeDialog()" class="close-btn" matTooltip="Close"
        >cancel</mat-icon
      >
    </div>
  </div>
  <div mat-dialog-content>
    <img
      *ngIf="objectType == 'image'"
      [src]="objectURL"
      alt="Preview"
      class="w-100"
    />
    <video
      *ngIf="objectType == 'video'"
      [src]="objectURL"
      controls
      class="w-100"
    ></video>
    <audio
      *ngIf="objectType == 'audio'"
      [src]="objectURL"
      controls
      class="mw-100 mh-100"
    ></audio>
  </div>
</ng-template>
